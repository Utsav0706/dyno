[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dyno"
version = "0.1.0"
description = "Agent evaluation harness: run an agent on test cases, record every step, score, compare, gate CI."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Utsav Jivani (Uv)" }]
# Only what the code imports today. Each milestone adds its own dependencies.
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
dyno = "dyno.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dyno"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics, I: import order, UP: modern syntax,
# B: likely bugs, SIM: simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
